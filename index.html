<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--讓手機以裝置的顯示寬度作為排版依據-->
    <title>MIKEY 的個人網站</title>
    <link rel="stylesheet" href="style.css"> <!--rel="stylesheet"說明連結的資源是樣式表-->
    <script src="script.js" defer></script>
</head>

<body>
    <main class="home">   <!--main是主要內容,div是一般容器-->
        <div class="portrait">
            <img src="assets/mikey-ringside.jpg" alt="MIKEY WOTD">
        </div>
        <div class="content">
            <h1>你好，我是 MIKEY。</h1>
            <p class="role">從健身教練，走向資訊安全。</p>  <!--class類別-->
            
            <nav class="menu" aria-label="內容目錄">       <!--nav導覽區,button按鈕,span分組 -->
                <button type="button" class="menu-item" id="about-button">
                    <span class="menu-number">01</span>
                    <span>關於我</span>
                </button>

                <button type="button" class="menu-item">
                    <span class="menu-number">02</span>
                    <span>作品集</span>
                </button>

                <button type="button" class="menu-item">
                    <span class="menu-number">03</span>
                    <span>格鬥與生活</span>
                </button>

                <button type="button" class="menu-item">
                    <span class="menu-number">04</span>
                    <span>IT鐵人賽</span>
                </button>
            </nav>

        </div>
    </main>
    <dialog id="about-panel">  <!--dialog是HTML的視窗元素-->
        <button type="button" id="close-about">關閉</button>

        <h2>關於我</h2>
        <p>我曾擔任五年健身教練，其中三年擔任過訓練主任。</p>
        <p>目前正在學習資訊安全，希望累積實作能力。</p>
    </dialog>
</body>

</html>
